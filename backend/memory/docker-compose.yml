version: '3.8'

services:
  # 1. Relational Database Service (The Primary Core DB)
  postgres_db:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: ai_project_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

  # 2. In-Memory Cache Service (For Chat History & Session States)
  redis_cache:
    image: redis:7-alpine
    container_name: local_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data

# Reserve permanent folders on your laptop so data is never wiped out on restart
volumes:
  postgres_local_data:
  redis_local_data:
